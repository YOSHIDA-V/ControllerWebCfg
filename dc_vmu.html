icon_url: icon.png
index: index.html

{% include_relative _includes/intro.html %}

<div class="doc-link-panel">
    <p><strong>このページの説明</strong><br>
    <a href="help.html#dc-vmu">DC VMU管理の使い方</a></p>
</div>

<!-- Base on https://www.html5rocks.com/en/tutorials/file/dndfiles// -->
<div id="divBtConn">
    <button id="btConn">VS-C4に接続</button><br>
    <small><i>VMU 管理のために接続する前に、VS-C4からすべてのコントローラーを切断してください。</i></small>
</div>
<div id="divInfo" role="status" aria-live="polite" style="display:none;margin-bottom:1em;"></div>
<div id="divFileSelect" style="display:none;margin-bottom:1em;">
    <button id="btnPakRead">読み出し</button><br><br>
    <button id="btnPakWrite">書き込み</button>
    書き込む .BIN ファイルを選択:
    <input type="file" id="pakFile"/><br><br>
</div>
<div id="divFileTransfer" style="display:none;margin-bottom:1em;">
    <div id="progress_bar" role="progressbar" aria-label="VMU転送の進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="percent">0%</div></div>
    <button id="btnFileTransferCancel">キャンセル</button>
</div>

{% include output_helper.html %}

<script type="module">
  import { btConn, pakRead, pakWrite, abortFileTransfer } from './dc_vmu.js';

  document.getElementById("btnPakRead").addEventListener('click', pakRead);
  document.getElementById("btnPakWrite").addEventListener('click', pakWrite);
  document.getElementById("btnFileTransferCancel").addEventListener('click', abortFileTransfer);
  document.getElementById("btConn").addEventListener('click', function() {
    if (isWebBluetoothEnabled()) {
      ChromeSamples.clearLog();
      btConn();
    }
  });
</script>
